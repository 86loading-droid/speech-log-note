name = "speech-log-voice"
main = "worker.js"
compatibility_date = "2026-01-01"

# 음성과 글은 거쳐 갈 뿐 남지 않습니다.
# 아래 KV 한 칸만 씁니다. 코랩이 켜졌을 때 그 주소를 6시간 동안 보관해,
# 앱이 QR 없이 스스로 연결하게 하는 용도입니다. 음성·글은 담지 않습니다.
#   npx wrangler kv namespace create SRV      → 나온 id 를 아래에 적으십시오
# [[kv_namespaces]]
# binding = "SRV"
# id = "여기에 붙여넣기"

[vars]
ALLOW_ORIGIN = "https://86loading-droid.github.io"
MAX_CHARS = "200"

# 무료 경로: 허깅페이스 Space
BACKEND = "hf"
SPACE = "계정-스페이스이름.hf.space"

# 유료 경로로 바꾸려면 BACKEND 를 "fal" 로 고치고 FAL_KEY 를 넣으십시오.
# SIZE = "0.6b"

# 비밀값은 파일에 적지 말고 아래 명령으로 넣으십시오.
#   npx wrangler secret put APP_TOKEN
#   npx wrangler secret put HF_TOKEN     # 무료 경로
#   npx wrangler secret put FAL_KEY      # 유료 경로
